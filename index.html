<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main>
    <div class="card">
      
      <div class="cardContent">
        <img src="./assets/images/illustration-article.svg" alt="Main Image" class="cardImage">
        <h1 class="learningTitle">Learning</h1>
        <p class="cardCategory">Published 24 May 2026</p>
        <h1 class="cardTitle">HTML & CSS Foundations</h1>
        <p class="cardDescription">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        <div class="cardAuthor">
          <img src="./assets/images/image-avatar.webp" alt="Avatar" class="cardAuthorImage">
          <p class="card__author-name">Hamish O'Kane</p>
        </div>
      </div>
    </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Hamish O'Kane</a>.
  </footer>
</body>
</html>
